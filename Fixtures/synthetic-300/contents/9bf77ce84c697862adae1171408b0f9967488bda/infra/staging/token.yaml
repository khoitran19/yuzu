name: Seller checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  merge-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Merge channels 👀
        run: pnpm moon run channel:merge -- --reporter=dot --shard=3/4
  prune-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v5
      - name: Prune checkouts ✅
        run: pnpm moon run checkout:prune -- --reporter=dot --shard=2/4
  resolve-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Resolve buyers 📦
        run: pnpm moon run buyer:resolve -- --reporter=dot --shard=1/4
  fetch-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - name: Fetch buyers ✅
        run: pnpm moon run buyer:fetch -- --reporter=dot --shard=3/4
  update-price:
    runs-on: ubuntu-latest
    timeout-minutes: 31
    steps:
      - uses: actions/checkout@v5
      - name: Update prices 🔥
        run: pnpm moon run price:update -- --reporter=dot --shard=2/4
  prune-seller:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - name: Prune sellers 👀
        run: pnpm moon run seller:prune -- --reporter=dot --shard=4/4
  prune-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - name: Prune wallets 🚚
        run: pnpm moon run wallet:prune -- --reporter=dot --shard=1/4
  publish-thread:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
      - name: Publish threads 🎉
        run: pnpm moon run thread:publish -- --reporter=dot --shard=1/4
  archive-session:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v5
      - name: Archive sessions 🧾
        run: pnpm moon run session:archive -- --reporter=dot --shard=1/4
  load-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
