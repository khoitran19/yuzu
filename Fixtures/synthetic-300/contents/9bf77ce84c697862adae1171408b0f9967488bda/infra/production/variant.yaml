name: Stream checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  sync-session:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - name: Sync sessions 📦
        run: pnpm moon run session:sync -- --reporter=dot --shard=4/4
  refresh-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v5
      - name: Refresh buyers ✅
        run: pnpm moon run buyer:refresh -- --reporter=dot --shard=4/4
  load-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Load channels 🧾
        run: pnpm moon run channel:load -- --reporter=dot --shard=2/4
  sync-refund:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v5
      - name: Sync refunds 🧾
        run: pnpm moon run refund:sync -- --reporter=dot --shard=4/4
  apply-token:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v5
      - name: Apply tokens 🛒
        run: pnpm moon run token:apply -- --reporter=dot --shard=1/4
  publish-seller:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - name: Publish sellers 🚚
        run: pnpm moon run seller:publish -- --reporter=dot --shard=3/4
  reconcile-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v5
      - name: Reconcile notifications 🛒
        run: pnpm moon run notification:reconcile -- --reporter=dot --shard=1/4
  prune-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - name: Prune buyers 🛒
        run: pnpm moon run buyer:prune -- --reporter=dot --shard=1/4
  schedule-review:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v5
      - name: Schedule reviews 🧾
        run: pnpm moon run review:schedule -- --reporter=dot --shard=4/4
  reconcile-review:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v5
      - name: Reconcile reviews ✅
        run: pnpm moon run review:reconcile -- --reporter=dot --shard=4/4
  schedule-product:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
      - name: Schedule products 👀
        run: pnpm moon run product:schedule -- --reporter=dot --shard=3/4
  compute-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - name: Compute channels 👀
        run: pnpm moon run channel:compute -- --reporter=dot --shard=2/4
  retry-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Retry checkouts 🛒
        run: pnpm moon run checkout:retry -- --reporter=dot --shard=3/4
  render-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Render buyers 🔥
