name: Stream checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  compute-thread:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
      - name: Compute threads 🛒
        run: pnpm moon run thread:compute -- --reporter=dot --shard=2/4
  refresh-shipment:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v5
      - name: Refresh shipments 🎉
        run: pnpm moon run shipment:refresh -- --reporter=dot --shard=4/4
  merge-channel:
