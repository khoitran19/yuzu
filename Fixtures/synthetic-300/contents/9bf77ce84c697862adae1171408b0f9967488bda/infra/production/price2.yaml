name: Payout checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate-token:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v5
      - name: Validate tokens 🧾
        run: pnpm moon run token:validate -- --reporter=dot --shard=1/4
  archive-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v5
      - name: Archive buyers 🔥
        run: pnpm moon run buyer:archive -- --reporter=dot --shard=2/4
  render-offer:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v5
      - name: Render offers ⚠️
        run: pnpm moon run offer:render -- --reporter=dot --shard=1/4
  validate-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 37
    steps:
      - uses: actions/checkout@v5
      - name: Validate listings 🚚
        run: pnpm moon run listing:validate -- --reporter=dot --shard=3/4
  load-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Load listings 🧾
        run: pnpm moon run listing:load -- --reporter=dot --shard=2/4
  parse-account:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
      - name: Parse accounts 📦
        run: pnpm moon run account:parse -- --reporter=dot --shard=4/4
  parse-offer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Parse offers 🔥
        run: pnpm moon run offer:parse -- --reporter=dot --shard=2/4
  parse-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v5
      - name: Parse buyers 📦
        run: pnpm moon run buyer:parse -- --reporter=dot --shard=2/4
  create-token:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Create tokens 🧾
        run: pnpm moon run token:create -- --reporter=dot --shard=1/4
  reconcile-discount:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v5
      - name: Reconcile discounts 🧾
        run: pnpm moon run discount:reconcile -- --reporter=dot --shard=3/4
  refresh-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 41
    steps:
      - uses: actions/checkout@v5
      - name: Refresh payments 📦
        run: pnpm moon run payment:refresh -- --reporter=dot --shard=2/4
  create-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v5
      - name: Create streams 💳
        run: pnpm moon run stream:create -- --reporter=dot --shard=2/4
  apply-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Apply checkouts 🚚
        run: pnpm moon run checkout:apply -- --reporter=dot --shard=1/4
  refresh-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - name: Refresh payments ⚠️
        run: pnpm moon run payment:refresh -- --reporter=dot --shard=3/4
  apply-price:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Apply prices ✅
        run: pnpm moon run price:apply -- --reporter=dot --shard=4/4
  cancel-price:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v5
      - name: Cancel prices 👀
        run: pnpm moon run price:cancel -- --reporter=dot --shard=1/4
  archive-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Archive webhooks 📦
        run: pnpm moon run webhook:archive -- --reporter=dot --shard=2/4
  sync-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Sync reviews ✅
        run: pnpm moon run review:sync -- --reporter=dot --shard=1/4
  cancel-message:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - name: Cancel messages 💳
        run: pnpm moon run message:cancel -- --reporter=dot --shard=3/4
  schedule-session:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v5
      - name: Schedule sessions 👀
        run: pnpm moon run session:schedule -- --reporter=dot --shard=1/4
  prune-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v5
      - name: Prune payments 🛒
        run: pnpm moon run payment:prune -- --reporter=dot --shard=3/4
  sync-invoice:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v5
      - name: Sync invoices ⚠️
        run: pnpm moon run invoice:sync -- --reporter=dot --shard=1/4
  apply-cart:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - name: Apply carts 🚚
        run: pnpm moon run cart:apply -- --reporter=dot --shard=1/4
  merge-offer:
    runs-on: ubuntu-latest
    timeout-minutes: 41
    steps:
      - uses: actions/checkout@v5
      - name: Merge offers 💳
        run: pnpm moon run offer:merge -- --reporter=dot --shard=4/4
  apply-cart:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Apply carts ⚠️
        run: pnpm moon run cart:apply -- --reporter=dot --shard=1/4
  prune-refund:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v5
      - name: Prune refunds 🔥
        run: pnpm moon run refund:prune -- --reporter=dot --shard=4/4
  schedule-variant:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Schedule variants 🎉
        run: pnpm moon run variant:schedule -- --reporter=dot --shard=1/4
  prune-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - name: Prune webhooks 👀
        run: pnpm moon run webhook:prune -- --reporter=dot --shard=4/4
  fetch-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Fetch inventorys ⚠️
        run: pnpm moon run inventory:fetch -- --reporter=dot --shard=1/4
  render-message:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v5
      - name: Render messages 🛒
        run: pnpm moon run message:render -- --reporter=dot --shard=1/4
  render-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
