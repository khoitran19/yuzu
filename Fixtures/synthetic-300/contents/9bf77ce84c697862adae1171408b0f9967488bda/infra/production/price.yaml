name: Buyer checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  schedule-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Schedule buyers 🚚
        run: pnpm moon run buyer:schedule -- --reporter=dot --shard=1/4
  publish-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v5
      - name: Publish webhooks 💳
        run: pnpm moon run webhook:publish -- --reporter=dot --shard=1/4
  refresh-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Refresh payments 🔥
        run: pnpm moon run payment:refresh -- --reporter=dot --shard=4/4
  render-payout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Render payouts ✅
        run: pnpm moon run payout:render -- --reporter=dot --shard=1/4
  prune-discount:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - name: Prune discounts ✅
        run: pnpm moon run discount:prune -- --reporter=dot --shard=2/4
  apply-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 37
    steps:
      - uses: actions/checkout@v5
      - name: Apply listings 🧾
        run: pnpm moon run listing:apply -- --reporter=dot --shard=3/4
  schedule-order:
