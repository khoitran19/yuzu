      - name: Validate reviews ⚠️
        run: pnpm moon run review:validate -- --reporter=dot --shard=1/4
  update-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v5
      - name: Update channels ✅
        run: pnpm moon run channel:update -- --reporter=dot --shard=2/4
  compute-shipment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Compute shipments 🎉
        run: pnpm moon run shipment:compute -- --reporter=dot --shard=2/4
  validate-price:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v5
      - name: Validate prices ⚠️
        run: pnpm moon run price:validate -- --reporter=dot --shard=3/4
  reconcile-invoice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Reconcile invoices 💳
        run: pnpm moon run invoice:reconcile -- --reporter=dot --shard=1/4
  fetch-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v5
      - name: Fetch buyers 🔥
        run: pnpm moon run buyer:fetch -- --reporter=dot --shard=1/4
  sync-message:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - name: Sync messages 🔥
        run: pnpm moon run message:sync -- --reporter=dot --shard=1/4
  resolve-variant:
    runs-on: ubuntu-latest
