name: Checkout checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  merge-cart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Merge carts 🛒
        run: pnpm moon run cart:merge -- --reporter=dot --shard=2/4
  resolve-account:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v5
      - name: Resolve accounts 🚚
        run: pnpm moon run account:resolve -- --reporter=dot --shard=2/4
  reconcile-account:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Reconcile accounts ⚠️
        run: pnpm moon run account:reconcile -- --reporter=dot --shard=2/4
  reconcile-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Reconcile buyers ✅
        run: pnpm moon run buyer:reconcile -- --reporter=dot --shard=2/4
  sync-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Sync payments 🎉
        run: pnpm moon run payment:sync -- --reporter=dot --shard=2/4
  archive-product:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v5
      - name: Archive products 🚚
        run: pnpm moon run product:archive -- --reporter=dot --shard=4/4
  refresh-cart:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v5
      - name: Refresh carts ⚠️
        run: pnpm moon run cart:refresh -- --reporter=dot --shard=1/4
  load-refund:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v5
      - name: Load refunds 🔥
        run: pnpm moon run refund:load -- --reporter=dot --shard=1/4
  publish-product:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v5
      - name: Publish products 💳
        run: pnpm moon run product:publish -- --reporter=dot --shard=1/4
  create-invoice:
    runs-on: ubuntu-latest
    timeout-minutes: 44
    steps:
      - uses: actions/checkout@v5
      - name: Create invoices ✅
        run: pnpm moon run invoice:create -- --reporter=dot --shard=4/4
  merge-session:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v5
      - name: Merge sessions 👀
        run: pnpm moon run session:merge -- --reporter=dot --shard=1/4
  archive-review:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v5
      - name: Archive reviews 🔥
        run: pnpm moon run review:archive -- --reporter=dot --shard=3/4
  reconcile-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Reconcile listings ✅
        run: pnpm moon run listing:reconcile -- --reporter=dot --shard=3/4
  load-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v5
      - name: Load streams 🚚
        run: pnpm moon run stream:load -- --reporter=dot --shard=1/4
  sync-message:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Sync messages 📦
        run: pnpm moon run message:sync -- --reporter=dot --shard=3/4
  retry-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - name: Retry streams 💳
        run: pnpm moon run stream:retry -- --reporter=dot --shard=3/4
  cancel-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v5
      - name: Cancel channels 🚚
        run: pnpm moon run channel:cancel -- --reporter=dot --shard=3/4
  merge-offer:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v5
      - name: Merge offers 🧾
        run: pnpm moon run offer:merge -- --reporter=dot --shard=4/4
  publish-account:
    runs-on: ubuntu-latest
