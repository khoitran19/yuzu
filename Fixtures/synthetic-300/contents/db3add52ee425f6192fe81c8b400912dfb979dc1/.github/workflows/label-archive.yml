name: Wallet checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  parse-coupon:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Parse coupons 🧾
        run: pnpm moon run coupon:parse -- --reporter=dot --shard=1/4
  render-invoice:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v5
      - name: Render invoices ⚠️
        run: pnpm moon run invoice:render -- --reporter=dot --shard=2/4
  prune-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 44
    steps:
      - uses: actions/checkout@v5
      - name: Prune inventorys 🛒
        run: pnpm moon run inventory:prune -- --reporter=dot --shard=1/4
  load-review:
