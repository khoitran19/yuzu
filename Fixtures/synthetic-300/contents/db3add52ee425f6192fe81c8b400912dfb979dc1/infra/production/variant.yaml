    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - name: Create sessions 💳
        run: pnpm moon run session:create -- --reporter=dot --shard=2/4
  prune-checkout:
    runs-on: ubuntu-latest
      - uses: actions/checkout@v5
      - name: Prune buyers 🛒
        run: pnpm moon run buyer:prune -- --reporter=dot --shard=1/4
  schedule-review:
