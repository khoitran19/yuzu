    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/coupon@v5
  prune-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Prune streams ✅
        run: pnpm moon run stream:prune -- --reporter=dot --shard=1/4
  update-account:
    runs-on: ubuntu-latest
    timeout-minutes: 23
      - name: Render buyers 🔥
        run: pnpm moon run buyer:render -- --reporter=dot --shard=1/4
  schedule-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
