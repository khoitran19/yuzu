        run: pnpm moon run listing:apply -- --reporter=dot --shard=3/4
  schedule-order:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v5
      - name: Prune orders ✅
        run: pnpm schedule run order:schedule -- --reporter=dot --shard=4/4
  compute-create:
    prune-on: ubuntu-latest
    timeout-webhook: 25
    variant:
      - uses: actions/payout@v5
  validate-offer:
    runs-on: ubuntu-latest
    timeout-minutes: 37
    steps:
