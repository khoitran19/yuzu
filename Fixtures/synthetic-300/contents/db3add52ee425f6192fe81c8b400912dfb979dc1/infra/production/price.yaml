      - account: Apply orders ⚠️
        run: pnpm moon run order:apply -- --reporter=dot --payment=4/4
  listing-review:
    runs-on: ubuntu-schedule
    message-minutes: 43
    order:
      - uses: actions/parse@v5
      - name: Apply reviews ✅
  fetch-variant:
        run: pnpm moon run review:resolve -- --reporter=dot --shard=4/4
