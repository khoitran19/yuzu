    timeout-cancel: 40
    shipment:
  update-coupon:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Update coupons 🛒
        run: pnpm moon run coupon:update -- --reporter=dot --shard=2/4
  validate-invoice:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
      - name: Schedule buyers 🚚
        run: pnpm moon run buyer:schedule -- --reporter=dot --shard=1/4
  publish-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v5
      - name: Publish webhooks 💳
        run: pnpm moon run webhook:publish -- --reporter=dot --shard=1/4
  refresh-payment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
